aid: mecka-ai
name: Mecka AI
description: 'Mecka AI is the data and deployment layer for physical AI — it captures,
  structures, and evaluates real-world human and robot activity into datasets that
  robotics and embodied-AI teams can train on. Rather than building robots, Mecka
  positions itself as the integrator of the robotics ecosystem, plugging into hardware
  makers, frontier model labs, and commercial partners and owning the last-mile data,
  annotation, QA, and evaluation layer between them. Its Egoverse dataset captures
  large-scale first-person (egocentric) human activity across tasks and environments,
  and a companion iOS app lets teams collect task-specific data at scale. Mecka is
  backed by Forerunner Ventures and raised a $60M Series A in 2026. As of this pass
  Mecka publishes a marketing site, an iOS data-collection app, and the Egoverse data
  platform, but no public developer API, SDK, or documentation surface.'
